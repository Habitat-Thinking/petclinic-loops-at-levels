# Harness constraint enforcement for pull requests.
#
# Generated by the harness-engineering plugin.
# Runs PR-scoped constraints from HARNESS.md against changed files.
#
# Inspired by Birgitta Boeckeler's "Harness Engineering":
# https://martinfowler.com/articles/exploring-gen-ai/harness-engineering.html

name: Harness Constraints

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Investigative loop: Mondays 07:00 UTC. Finds what accumulates between changes,
    # which no per-change gate can see.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce PR constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-decision-record.sh diffs against the base, so it needs history.
          fetch-depth: 0

      - name: Check HARNESS.md exists
        run: |
          if [ ! -f HARNESS.md ]; then
            echo "::warning::No HARNESS.md found — skipping constraint enforcement"
            exit 0
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: "Constraint: Decision record for source changes"
        run: scripts/check-decision-record.sh "origin/${{ github.base_ref }}"

      - name: "Constraint: Consistent formatting"
        run: ./mvnw -B spring-javaformat:validate

      - name: "Constraint: Tests must pass"
        run: ./mvnw -B verify

      - name: Summary
        if: always()
        run: echo "Harness constraint check complete. See HARNESS.md for constraint details."

  # The investigative loop. Not a gate: it reports what has accumulated since the last
  # sweep. Scheduled, because entropy does not arrive with a pull request attached.
  sweep:
    name: Scheduled sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "GC: every source change since the last tag carries a decision record"
        run: |
          base=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Sweeping $base..HEAD"
          scripts/check-decision-record.sh "$base" || echo "::warning::source changes since $base have no decision record"

      - name: "GC: reflection entries awaiting promotion or retirement"
        run: |
          count=$(ls reflections/active/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "$count active reflection entries"
          if [ "$count" -gt 10 ]; then
            echo "::warning::$count reflection entries are still active — review them (HARNESS.md garbage collection)"
          fi

      - name: "GC: constraints that name a tool which no longer exists"
        run: |
          missing=0
          for tool in scripts/check-decision-record.sh scripts/harness-advisory.sh; do
            [ -x "$tool" ] || { echo "::warning::HARNESS.md names $tool, which is missing or not executable"; missing=1; }
          done
          grep -q 'SchemaParityTest' HARNESS.md && \
            [ -f src/test/java/org/springframework/samples/petclinic/harness/SchemaParityTest.java ] || \
            { echo "::warning::HARNESS.md names SchemaParityTest, which is missing"; missing=1; }
          exit 0
