      - "Q5 (description integrity): the draft described a 'ubiquitous language mismatch between booking and visit', which is the textbook phrase and not an observation. Replaced with the specific inventory: one key, one flash message, zero types, zero tables, and what nine bundles actually say."
      - "CC3 (cross-confounders): the architectural collection contains no Booking-shaped artefact at all, and the two things that look like one are a message key and the visits table. That absence is the claim rather than a gap in the modelling, so the description was revised to say the concept exists only in the product's voice — and the near-misses named explicitly so a reader does not go looking for a class that was never there."
