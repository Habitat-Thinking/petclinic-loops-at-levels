      - "Q1 (boundary): this element has no boundary in the code, which is the reason it nearly was not drafted. It was kept, reframed from 'a validation component' to 'a policy with no home', because the absence of the boundary is the finding a maintainer needs and no element scoped to a single file can carry it."
      - "Q2 (evidence): the draft said the rules are spread across the controller and the schema. All five sites were enumerated and cited individually, including the client-side th:min, so the claim is checkable rather than an impression."
      - "Q4 (confidence): high, because the claim is an enumeration and every item in it is cited. It is not a claim that the distribution causes defects — one such defect was already found and fixed here by an adversarial pass rather than by review, but that is history, not evidence for this element."
      - "CC4 (cross-confidence calibration): read against the domain element 'The visit's vet', this rule set enforces presence and nothing else — that a vet id exists, that a date is after today, that a time was posted. The domain constraints a clinic would recognise (this vet is free at this hour, this visit does not collide with another) are absent, and the rule set has no place to express them. The description was calibrated to say what the rules decide rather than implying they decide whether a booking is sound."

