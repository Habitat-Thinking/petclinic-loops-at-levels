  - name: The three-dialect visits schema and its parity gate
    description: |
      The visits table in db/h2, db/mysql and db/postgres, each gaining vet_id
      NOT NULL with a foreign key to vets and start_time TIME NOT NULL, with
      visit_date DATE NOT NULL, plus four backfilled seed rows per dialect
      rewritten from positional inserts to explicit column lists. AGENTS.md
      directive 2 requires all three to move together and SchemaParityTest is the
      enforcing gate.

      The gate is real and was extended by this work: it records each column as
      (length, notNull) rather than a bare length, and a third check,
      nullabilityAgreesAcrossDialects, compares nullability across all three
      pairs of dialects. It counts PRIMARY KEY as NOT NULL, with the reason
      written beside the pattern, so it does not fail on day one over implicit
      identity columns. Without that check a later change could drop NOT NULL
      from exactly one dialect and pass every gate in the project.

      What the gate cannot see is stated in the decision record and is worth
      repeating in a legibility model, because it is the difference between a
      constraint and the appearance of one: the test compares the three files to
      each other. It starts no database and attempts no insert. If all three
      files lose NOT NULL together the check is silent by design. And the
      nullability of a column is the only semantic the parity check understands —
      the fact that visit_date has no CHECK constraint, that no unique constraint
      prevents two visits naming the same vet at the same minute, and that the
      four seeded rows all sit in the past, are invisible to it.
