  - name: Booking
    description: |
      The product's word for what this feature does, which appears in the code
      once and never as a noun. VisitController sets a flash message resolved
      from the key visitBooked — "Your visit has been booked". There is no
      Booking type, no bookings table, no booking column, no method with book in
      its name. Every identifier in the feature says visit.

      The split widens in translation. The nine non-English bundles render
      visitBooked with reservation and appointment vocabulary — 診察のご予約が完了しました
      in Japanese, 방문이 예약되었습니다 in Korean, ویزیت شما رزرو شد in Persian, Ваш
      визит забронирован in Russian, Ziyaretiniz rezerve edildi in Turkish — and
      the decision record itself notes that a Russian or Turkish clinic would
      more naturally say "you have an appointment". So in nine languages the
      product tells the user an appointment was reserved, in English it says a
      visit was booked, and in the code it is a row in visits.

      Whether "booking" is a domain concept here or just ordinary English is
      genuinely arguable, and I have left it at medium confidence for that
      reason. What is not arguable is that this feature has two vocabularies —
      one the user hears and one the code speaks — and that no artefact in the
      repository states that they refer to the same thing.
    evidence:
