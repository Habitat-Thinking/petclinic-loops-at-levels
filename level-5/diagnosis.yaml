domain:

  - name: Visit
    description: |
      In this codebase "Visit" names two different things and nothing in the code
      distinguishes them.

      A visit the application creates is an appointment that has not happened.
      The constructor defaults its date to tomorrow, the controller rejects any
      date not after today, the form offers 09:00, and the flash message says the
      visit "has been booked". A visit the application reads may be the opposite:
      every database ships with four seeded rows dated in the past (2013 in h2,
      2008-2011 in mysql and postgres), and their descriptions are records of
      procedures performed — "rabies shot", "neutered", "spayed". The visit form
      lists saved visits under the heading "Previous Visits".

      There is no field, flag, status or type that separates the two. A visit's
      kind is decided entirely by reading its date against today, and only the
      creation path does that. The required description compounds it: a user must
      write a description before the visit happens, into a field whose seeded
      values describe what was done afterwards, so the same column means "why I
      am coming" on one row and "what was done" on another.

      A third state exists only in memory. VisitController's @ModelAttribute
      method constructs a blank Visit and attaches it to the pet
      (pet.addVisit(visit)) before the user has entered anything, so a Pet's
      visits collection routinely contains a visit that does not exist. The
      template filters it out with th:if="${!visit['new']}". So "a pet's visits"
      means, precisely: past records, future appointments, and one blank that is
      neither — and the distinction between the three is carried by a date
      comparison, a template conditional and a heading, not by the model.
    evidence:
      - path: src/main/java/org/springframework/samples/petclinic/owner/Visit.java
        excerpt: |
          public Visit() {
              this.date = LocalDate.now().plusDays(1);
          }
      - path: src/main/java/org/springframework/samples/petclinic/owner/VisitController.java
        excerpt: |
          if (visit.getDate() != null && !visit.getDate().isAfter(LocalDate.now())) {
              result.rejectValue("date", "typeMismatch.visitDate");
          }
      - path: src/main/resources/db/mysql/data.sql
        excerpt: "INSERT IGNORE INTO visits (id, pet_id, vet_id, visit_date, start_time, description) VALUES (3, 8, 3, '2009-06-04', '14:00:00', 'neutered');"
      - path: src/main/resources/templates/pets/createOrUpdateVisitForm.html
        excerpt: |
          <b th:text="#{previousVisits}">Previous Visits</b>
          ...
          <tr th:if="${!visit['new']}" th:each="visit : ${pet.visits}">
      - path: src/main/java/org/springframework/samples/petclinic/owner/VisitController.java
        excerpt: |
          Visit visit = new Visit();
          pet.addVisit(visit);
          return visit;
    confidence: high
    challenge_notes:
      - "Q5 (description integrity): the draft opened with 'a Visit is a scheduled appointment between a pet and a vet at a date and time' — a definition that would fit any clinic system and says nothing about this one. Replaced entirely with the codebase-specific finding: the term covers two lifecycle states that no field distinguishes, evidenced from the constructor, the future-date rejection and the historical seed rows."
      - "Q1 (boundary): 'Description' and 'Previous visits' were drafted as separate domain elements. Both were folded in here. Neither is a concept in its own right in this codebase — each is a piece of evidence for the same ambiguity, and separating them would have spread one finding across three elements and made it look like three."
      - "CC5 (mutual description integrity): the architectural collection surfaced a state this element had assumed away. VisitController attaches a blank Visit to the pet before anything is entered, so 'a visit' also denotes an object in a collection that has no database row and is filtered out of display by a template conditional. The third state was added; the architectural VisitController element already carried the loadPetWithVisit evidence and was not altered."

  - name: Start time
    description: |
      The time of day a visit is due to begin. It has three names in this
      feature: the Java field is startTime, the column is start_time, and the
      user sees a label from the message key visitTime, which reads "Visit Time"
      in English and "Besuchszeit", "Hora de visita", "診察時間" and so on in the
      other bundles. Nothing states that these are one thing; the @Column
      annotation joins the first two and the third is joined by nothing.

      The word "start" is the only thing in the whole feature that implies an
      interval, and there is no other end. No duration, no end time, no slot
      length, no appointment type carrying an implied length, and no requirement
      that mentions one. The decision record is explicit that this is deliberate
      — availability and contention are later slices — but the field name
      promises a second value the model does not have, and the user-facing name
      (visitTime) does not make that promise, so the codebase and the product
      disagree about what the value is.

      Nor does it carry any notion of when a clinic is open. The column is TIME,
      the format is a fixed 24-hour HH:mm identical in every locale, and the
      input is type="time" with no step, min or max, so 03:17 is as bookable as
      09:00 — two visits may hold the same vet at the same minute, which the
      decision record states plainly as D4. There is no time zone anywhere: a
      LocalTime against a LocalDate, with the future-date rule evaluated against
      the server's LocalDate.now().
    evidence:
      - path: src/main/java/org/springframework/samples/petclinic/owner/Visit.java
        excerpt: |
          @Column(name = "start_time")
          @DateTimeFormat(pattern = "HH:mm")
