  - name: The visit-validity rule set, which has no home
    description: |
      What makes a visit acceptable is decided in five places, in four languages,
      and there is no file a reader can open to see the rule set whole.

      1. VisitController rejects a date that is not after today, with
         result.rejectValue("date", "typeMismatch.visitDate").
      2. The same method rejects a null date, a null vet and a null start time
         with the code "required", each guarded by !result.hasFieldErrors(...) so
         that a binder error is not compounded by a second, misleading message.
      3. Visit carries @NotBlank on description.
      4. All three schemas declare vet_id, visit_date and start_time NOT NULL.
      5. fragments/inputField.html sets th:min="${minVisitDate}" on the date
         input — a client-side hint only, with no required attribute anywhere on
         the form.

      Each individual rule is well argued. The choice of the "required" code over
      @NotNull is explained in the controller and in the decision record (every
      bundle already translates "required"; no bundle carries NotNull.visit.vet).
      The binder-error guards are explained in a comment that says what a user
      would otherwise see. The distribution is nevertheless the least legible
      thing in this change: a reader asking "what must be true of a visit?" has
      to hold a Java method, an entity annotation, three SQL files and a template
      attribute in mind at once, and nothing lists them.

      One specific naming defect makes it worse. The future-date rule ships under
      the error code typeMismatch.visitDate, whose message is "Visit date must be
      in the future". The code says the user typed the wrong kind of value; the
      message says they picked the wrong day. A reader grepping for the business
      rule will grep for the wrong word, and a reader meeting the code in a log
      or a binding result will read a parse failure.
    evidence:
      - path: src/main/java/org/springframework/samples/petclinic/owner/VisitController.java
        excerpt: |
          if (visit.getDate() != null && !visit.getDate().isAfter(LocalDate.now())) {
