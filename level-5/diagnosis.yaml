      - path: src/main/resources/db/postgres/schema.sql
        excerpt: "  start_time  TIME NOT NULL,"
      - path: decisions/2026-09-20-visit-carries-vet-and-time.md
        excerpt: "D4 - any vet, any time; no availability is consulted. Nothing checks whether the vet is free, and two visits may name the same vet at the same time."
    confidence: high
    challenge_notes:
      - "Q5 (description integrity): the first draft read 'the time at which a visit starts', which restates the identifier and would be true of any system. Replaced with the two findings specific to this code: one value under three names, and a name that implies an interval the model does not have."
      - "Q3 (confounders): visitDate, visitTime and minVisitDate are easy to mistake for one another — one is a persisted field's label, one is the label for a different persisted field, and one is a transient model attribute that never reaches the database and exists only to populate an HTML min. The description and the inputField element were written to keep the three apart."
      - "CC5 (mutual description integrity): the architectural elements confirm rather than soften the claim. The mapping shows a bare TIME column and no second column, and the shared input fragment shows type=\"time\" with no step, min or max. The 'no working hours, no duration' reading was stated more firmly on that evidence, and the absence of a time zone was added."

  - name: The visit's vet
    description: |
      The vet named on a visit. Required — vet_id is NOT NULL with a foreign key
      to vets in all three dialects, the controller rejects a missing one, and
      the decision record is explicit that a clinic visit without a vet is not a
      thing this product means to represent.

      What the word does not mean here is a commitment by that vet. The chooser
      is populated from VetRepository.findAll() with no filter of any kind: no
      availability, no specialty match against the reason for the visit, no
      active or employed flag. Nothing prevents two visits naming the same vet at
      the same minute. And the chooser has no blank or placeholder option, so a
      browser preselects the first vet in the list and a user who never touches
      the control still books one — "the chosen vet" can mean "the vet nobody
      chose". That hole is known and adjudicated as deferred, which makes it a
      decision rather than an accident, but it is a decision about what the word
      means and the code does not carry it.

      So Visit.vet is a recorded intention that a particular clinician will see
      this pet, with the same standing as the free-text description beside it: the
      system guarantees a vet id is present and that it resolves to a row in
      vets, and guarantees nothing else about it. The clinic-facing meaning a
      reader would naturally attach to the word — this vet is booked, at this
      time, and knows it — is nowhere implemented and nowhere denied in the code.
    evidence:
