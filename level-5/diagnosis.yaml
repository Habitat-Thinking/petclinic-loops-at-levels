  - name: VetFormatter
    description: |
      The conversion seam between the vet chooser's posted value and a Vet
      instance. print returns the vet's id (empty string for an unsaved vet);
      parse scans VetRepository.findAll() for a matching id and throws
      ParseException when there is none. Both directions work in ids, not names,
      and the class says why in its own javadoc: pet type names are unique by
      construction so PetTypeFormatter can parse one by name, but two vets can
      share a name, so a name-based parse would silently pick one of them.

      Three couplings hold this together that are stated in no single place.

      The registration is implicit: the class is a @Component implementing
      Formatter<Vet>, and Spring Boot's web auto-configuration adds every
      Formatter bean to the conversion service. WebConfiguration overrides only
      addInterceptors; nothing anywhere names this formatter as the thing that
      turns "2" into a Vet. The most explicit statement of the dependency in the
      repository is a line of test configuration:
      includeFilters = @ComponentScan.Filter(value = VetFormatter.class, ...).

      The chooser's option values must equal what print emits, or the selected
      vet will not be preselected on redisplay. selectVetField.html hardcodes
      th:value="${item.id}" and nothing ties the two ends together.

      Working in ids is also what makes the field bindable at all:
      @InitBinder disallows "id" and "*.id", so a form posting vet.id=2 would be
      ignored. The form posts vet=2 and the formatter converts it. That
      interaction is not mentioned in the javadoc, which explains the id choice
      on the different ground of name ambiguity.

      Behaviourally the class is small, well-named, and directly tested
      (VetFormatterTests covers both the hit and the miss). The linear scan over
      findAll() per parse is cheap because VetRepository.findAll() is
      @Cacheable("vets"), which the controller's javadoc states and the formatter
      relies on without saying so.
