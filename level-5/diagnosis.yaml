  - name: Pet.visits, the eager ordered association
    description: |
      The read path for a pet's visits: a @OneToMany with CascadeType.ALL and
      FetchType.EAGER over a join column, held in a LinkedHashSet, and ordered by
      @OrderBy("date ASC, startTime ASC"). The cascade is how a Visit is
      persisted at all (see VisitController), and the @OrderBy is the sole
      implementation of the requirement that two visits on one day read in the
      order they happen.

      The annotation is correct as written — date and startTime are entity
      attribute names, and JPA applies the ordering when Hibernate loads the
      collection — but nothing in the test suite can fail if it is deleted. The
      only test of the ordering, OwnerControllerTests.ownerDetailsOrdersSameDayVisitsByTime,
      runs under @WebMvcTest with a mocked OwnerRepository and builds its fixture
      in memory, adding the 09:00 visit before the 15:00 one. Iteration order
      there comes from LinkedHashSet insertion order; no persistence provider is
      involved and @OrderBy never executes. The test asserts the order of its own
      fixture. The persistence-level tests that do load visits from a database
      (ClinicServiceTests.shouldFindVisitsByPetId) assert size and non-nullness
      and never assert order — and the seeded rows are inserted in ascending
      order anyway, so an assertion there would be weak.

      This is recorded honestly in the decision record, which says the annotation
      was added because the requirement says so and that nothing checks it. It is
      recorded nowhere in the code. Pet.java line 58 carries the annotation and
      no comment, so a reader of the file cannot tell that the one line
      implementing the ordering requirement is unverified, and a reader of the
      test cannot tell that it is measuring the fixture.
